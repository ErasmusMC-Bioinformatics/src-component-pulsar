---
- name: Install Pre-requisites for Pulsar
  hosts: "{{ lookup('env', 'variable_host') | default('localhost', true) }}" # workaround because SRC needs localhost, but molecule needs specifc hostvars
  roles:
    - galaxyproject.repos
    - galaxyproject.slurm
  post_tasks:
    - name: Install Dependencies
      ansible.builtin.apt:
        update_cache: true
        name:
          - chrony
        state: present

    - name: deploy chrony.conf template
      template:
       src: templates/chrony.conf
       dest: /etc/chrony.conf
       owner: root
       group: root
       mode: 0644
       backup: yes

    - name: Restart chronyd
      service:
        name: chronyd
        state: restarted


- name: Install Pulsar Server
  hosts: "{{ lookup('env', 'variable_host') | default('localhost', true) }}" # workaround because SRC needs localhost, but molecule needs specifc hostvars

  pre_tasks:
    # Copied from mirelaminkova/src-component-galaxy
    - name: Set workspace user facts
      ansible.builtin.include_role:
        name: uusrc.general.fact_regular_users

    - name: Generate password
      set_fact:
        pulsar_token: "{{ lookup('community.general.random_string', base64=True, length=24) }}"

    - name: Install Dependencies
      ansible.builtin.apt:
        update_cache: true
        name:
          - build-essential
          - git
          - libcurl4-openssl-dev
          - libssl-dev
          - python3-psycopg2
          - python3-virtualenv
          - python3-dev
          - acl
          - gnutls-bin # workaround for git-clone issue, https://stackoverflow.com/a/53147659/4326632
        state: present

# Implementation to connect the Pulsar to Snellius and send jobs there.
    - name: Clone SLURM CLI API Proxy client
      ansible.builtin.git:
        repo: https://github.com/SLURM-CLI-API-Proxy/SLURM-CLI-API-Proxy-client.git
        dest: /opt/SLURM-CLI-API-Proxy-client
        version: main

    - name: Add deadsnakes PPA
      ansible.builtin.apt_repository:
        repo: ppa:deadsnakes/ppa
        state: present

    - name: Install Python 3.12 for the SLURM proxy
      ansible.builtin.apt:
        update_cache: true
        name:
          - python3.12
          - python3.12-venv
        state: present

    - name: Create virtual environment for SLURM CLI API Proxy client
      ansible.builtin.command:
        cmd: /usr/bin/python3.12 -m venv /opt/SLURM-CLI-API-Proxy-client/env
        creates: /opt/SLURM-CLI-API-Proxy-client/env/bin/python3.12

    - name: Install SLURM CLI API Proxy client and generated OpenAPI client
      ansible.builtin.pip:
        name:
          - /opt/SLURM-CLI-API-Proxy-client
          - /opt/SLURM-CLI-API-Proxy-client/slurm_api_client
        virtualenv: /opt/SLURM-CLI-API-Proxy-client/env

    # Upstream setup.py declares packages=["src", "slurm_api_client"], so the
    # real package (src/slurm_api_cli_proxy) is never importable on its own.
    - name: Expose src/ on the venv import path
      ansible.builtin.copy:
        content: "/opt/SLURM-CLI-API-Proxy-client/src\n"
        dest: /opt/SLURM-CLI-API-Proxy-client/env/lib/python3.12/site-packages/slurm_proxy_src.pth
        owner: root
        group: root
        mode: "0644"

  roles:
    - geerlingguy.docker
    - galaxyproject.cvmfs
    - usegalaxy_eu.apptainer
    - uusrc.general.nginx_reverse_proxy
    # https://github.com/galaxyproject/pulsar/issues/375
    - galaxyproject.pulsar

  post_tasks:
    - name: Create directory /srv/static/
      file:
        path: /srv/static/
        state: directory
        mode: '0755'

    - name: Template out the welcome
      template:
        src: templates/welcome.html
        dest: /srv/static/index.html
        owner: www-data
        group: www-data
        mode: '0640'

    - name: Ensure Pulsar config dir exists
      ansible.builtin.file:
        path: /etc/pulsar
        state: directory
        owner: "{{ pulsar_user.name }}"
        group: "{{ pulsar_user.name }}"
        mode: '0750'

    # The proxy shims read PROXY_SLURM_API_URL / SLURM_JWT / SLURM_USER from
    # the environment of the Pulsar service. To rotate an expired token:
    # edit /etc/pulsar/slurm_proxy.env, then `sudo systemctl restart pulsar`.
    - name: Configure SLURM proxy environment variables
      ansible.builtin.copy:
        dest: /etc/pulsar/slurm_proxy.env
        owner: "{{ pulsar_user.name }}"
        group: "{{ pulsar_user.name }}"
        mode: '0640'
        content: |
          PATH=/opt/SLURM-CLI-API-Proxy-client/env/bin:/mnt/pulsar/venv/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
          PROXY_SLURM_API_URL={{ proxy_slurm_api_url }}
          SLURM_JWT={{ slurm_jwt }}
          SLURM_USER={{ slurm_user }}
      no_log: true

    - name: Ensure pulsar systemd drop-in dir exists
      ansible.builtin.file:
        path: /etc/systemd/system/pulsar.service.d
        state: directory
        mode: '0755'

    - name: Make the Pulsar service load the proxy env file
      ansible.builtin.copy:
        dest: /etc/systemd/system/pulsar.service.d/slurm-proxy.conf
        mode: '0644'
        content: |
          [Service]
          EnvironmentFile=/etc/pulsar/slurm_proxy.env

    - name: Reload systemd and restart Pulsar with the proxy env
      ansible.builtin.systemd:
        name: pulsar
        state: restarted
        daemon_reload: true